<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="KIRAFACT">
  <!--
    Icono de pestaña PROVISIONAL.

    No reproduce ningún símbolo de marca de KIRAFACT: es solo una marca de color
