<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Automatización de procesos: tareas conectadas a un motor central y resultados verificados">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b22"/>
      <stop offset="0.55" stop-color="#0a1738"/>
      <stop offset="1" stop-color="#04102b"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.82" cy="0.16" r="0.6">
      <stop offset="0" stop-color="#0188EE" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0188EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.14" cy="0.86" r="0.55">
      <stop offset="0" stop-color="#25D366" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#25D366" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0188EE"/>
      <stop offset="1" stop-color="#25D366"/>
    </linearGradient>
    <linearGradient id="tarjeta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b3d"/>
      <stop offset="1" stop-color="#070f26"/>
    </linearGradient>
    <filter id="brillo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="960" height="600" fill="url(#bg)"/>
  <rect width="960" height="600" fill="url(#glowBlue)"/>
  <rect width="960" height="600" fill="url(#glowGreen)"/>

  <!-- Rejilla -->
  <g stroke="#7aa2ff" stroke-opacity="0.09" stroke-width="1">
    <path d="M480 96 L40 600"/>
    <path d="M480 96 L240 600"/>
    <path d="M480 96 L400 600"/>
    <path d="M480 96 L560 600"/>
    <path d="M480 96 L720 600"/>
    <path d="M480 96 L920 600"/>
    <path d="M0 400 H960"/>
    <path d="M0 470 H960"/>
    <path d="M0 556 H960"/>
  </g>

  <!-- Engranaje de fondo -->
  <g opacity="0.07" fill="none" stroke="#0188EE" stroke-width="10">
    <circle cx="812" cy="132" r="74"/>
    <circle cx="812" cy="132" r="44"/>
  </g>

  <!-- Conexiones -->
  <g fill="none" stroke="url(#barra)" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="7 9" stroke-linecap="round">
    <path d="M286 176 C352 176 356 268 402 288"/>
    <path d="M286 300 C338 300 360 300 402 300"/>
    <path d="M286 424 C352 424 356 332 402 312"/>
    <path d="M558 292 C620 292 636 250 690 250"/>
    <path d="M558 308 C620 308 636 360 690 360"/>
  </g>

  <!-- Partículas de datos -->
  <g fill="#25D366">
    <circle cx="344" cy="196" r="4.5"/>
    <circle cx="342" cy="300" r="4.5"/>
    <circle cx="344" cy="406" r="4.5"/>
    <circle cx="640" cy="266" r="4.5"/>
    <circle cx="642" cy="344" r="4.5"/>
  </g>
  <g fill="#25D366" opacity="0.35" filter="url(#brillo)">
    <circle cx="344" cy="300" r="8"/>
    <circle cx="642" cy="344" r="8"/>
  </g>

  <!-- Tarjetas de proceso (entrada) -->
  <g>
    <rect x="118" y="140" width="170" height="72" rx="16" fill="url(#tarjeta)" stroke="#5eb0ff" stroke-opacity="0.22"/>
    <circle cx="146" cy="166" r="9" fill="#0188EE" opacity="0.75"/>
    <rect x="166" y="160" width="86" height="9" rx="4.5" fill="#dbe7ff" opacity="0.36"/>
    <rect x="146" y="186" width="106" height="8" rx="4" fill="#8aa4d6" opacity="0.22"/>

    <rect x="112" y="264" width="178" height="72" rx="16" fill="url(#tarjeta)" stroke="#5eb0ff" stroke-opacity="0.22"/>
    <circle cx="140" cy="290" r="9" fill="#5eb0ff" opacity="0.8"/>
    <rect x="160" y="284" width="98" height="9" rx="4.5" fill="#dbe7ff" opacity="0.36"/>
    <rect x="140" y="310" width="118" height="8" rx="4" fill="#8aa4d6" opacity="0.22"/>

    <rect x="118" y="388" width="170" height="72" rx="16" fill="url(#tarjeta)" stroke="#5eb0ff" stroke-opacity="0.22"/>
    <circle cx="146" cy="414" r="9" fill="#a78bfa" opacity="0.8"/>
    <rect x="166" y="408" width="78" height="9" rx="4.5" fill="#dbe7ff" opacity="0.36"/>
    <rect x="146" y="434" width="100" height="8" rx="4" fill="#8aa4d6" opacity="0.22"/>
  </g>

  <!-- Núcleo de automatización -->
  <g>
    <circle cx="480" cy="300" r="118" fill="#0188EE" opacity="0.1" filter="url(#sombra)"/>
    <rect x="404" y="224" width="152" height="152" rx="34" fill="#0b1736" stroke="#5eb0ff" stroke-opacity="0.28"/>
    <rect x="404" y="224" width="152" height="152" rx="34" fill="none" stroke="url(#barra)" stroke-opacity="0.55" stroke-width="2"/>

    <g transform="translate(480 300)">
      <g fill="#25D366" opacity="0.9">
        <rect x="-8" y="-66" width="16" height="20" rx="5"/>
        <rect x="-8" y="-66" width="16" height="20" rx="5" transform="rotate(45)"/>
        <rect x="-8" y="-66" width="16" height="20" rx="5" transform="rotate(90)"/>
        <rect x="-8" y="-66" width="16" height="20" rx="5" transform="rotate(135)"/>
        <rect x="-8" y="-66" width="16" height="20" rx="5" transform="rotate(180)"/>
        <rect x="-8" y="-66" width="16" height="20" rx="5" transform="rotate(225)"/>
        <rect x="-8" y="-66" width="16" height="20" rx="5" transform="rotate(270)"/>
        <rect x="-8" y="-66" width="16" height="20" rx="5" transform="rotate(315)"/>
      </g>
      <circle r="48" fill="none" stroke="#25D366" stroke-width="7" opacity="0.75"/>
      <circle r="36" fill="#081228" stroke="#5eb0ff" stroke-width="2" opacity="0.9"/>
      <path fill="url(#barra)" d="M7 -27 L-15 6 L-3 6 L-8 27 L15 -6 L3 -6 Z"/>
    </g>
  </g>

  <!-- Tarjetas de resultado (salida) -->
  <g>
    <rect x="690" y="214" width="176" height="72" rx="16" fill="url(#tarjeta)" stroke="#25D366" stroke-opacity="0.25"/>
    <circle cx="718" cy="240" r="11" fill="#25D366" opacity="0.18"/>
    <path d="M713 240 l4 4 l7 -8" fill="none" stroke="#25D366" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="740" y="234" width="94" height="9" rx="4.5" fill="#dbe7ff" opacity="0.36"/>
    <rect x="718" y="260" width="112" height="8" rx="4" fill="#8aa4d6" opacity="0.22"/>

    <rect x="690" y="324" width="176" height="72" rx="16" fill="url(#tarjeta)" stroke="#25D366" stroke-opacity="0.25"/>
    <circle cx="718" cy="350" r="11" fill="#25D366" opacity="0.18"/>
    <path d="M713 350 l4 4 l7 -8" fill="none" stroke="#25D366" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="740" y="344" width="82" height="9" rx="4.5" fill="#dbe7ff" opacity="0.36"/>
    <rect x="718" y="370" width="104" height="8" rx="4" fill="#8aa4d6" opacity="0.22"/>
  </g>

  <!-- Destellos -->
  <g fill="#7cc4ff">
    <circle cx="336" cy="120" r="3"/>
    <circle cx="668" cy="120" r="3.5"/>
    <circle cx="744" cy="470" r="3"/>
    <circle cx="196" cy="520" r="3.5"/>
  </g>
</svg>
