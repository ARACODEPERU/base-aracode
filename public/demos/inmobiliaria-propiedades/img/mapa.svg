<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="titulo-mapa desc-mapa" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace">
    <title id="titulo-mapa">Plano de ubicación del departamento AL-2401</title>
    <desc id="desc-mapa">Plano del distrito: la avenida Los Alisos cruza frente al parque y el edificio del departamento está en la esquina con la calle Bolívar, a dos cuadras del Metropolitano.</desc>

    <defs>
        <pattern id="verde" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
            <rect width="12" height="12" fill="#E4EBD9"/>
            <line x1="0" y1="0" x2="0" y2="12" stroke="#CBD8BA" stroke-width="4"/>
        </pattern>
        <marker id="punta-mapa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 10 5 0 10z" fill="#4C6C0F"/>
        </marker>
    </defs>

    <rect x="0" y="0" width="760" height="540" fill="#F7F8F5"/>

    <!-- Título del plano -->
    <text x="30" y="26" font-size="15" font-weight="700" fill="#171B20" letter-spacing="2">MIRAFLORES · SECTOR LOS ALISOS</text>

    <!-- Manzanas -->
    <g fill="#EDF0EA" stroke="#DEE4D8" stroke-width="2">
        <rect x="30" y="40" width="60" height="140"/>
        <rect x="30" y="225" width="60" height="155"/>
        <rect x="30" y="415" width="60" height="85"/>
        <rect x="545" y="40" width="185" height="140"/>
        <rect x="120" y="225" width="400" height="155"/>
        <rect x="545" y="225" width="185" height="155"/>
        <rect x="120" y="415" width="400" height="85"/>
        <rect x="545" y="415" width="185" height="85"/>
    </g>

    <!-- Parque -->
    <g>
        <rect x="120" y="40" width="400" height="140" fill="url(#verde)" stroke="#CBD8BA" stroke-width="2"/>
        <text x="140" y="100" font-size="15" font-weight="700" fill="#4C6C0F" letter-spacing="2">PARQUE ALAMEDA</text>
        <text x="140" y="124" font-size="12" fill="#5B646E" letter-spacing="1">2,4 hectáreas · zona de juegos</text>
        <circle cx="240" cy="150" r="10" fill="none" stroke="#4C6C0F" stroke-width="2"/>
        <circle cx="300" cy="150" r="10" fill="none" stroke="#4C6C0F" stroke-width="2"/>
        <path d="M240 142v-10M300 142v-10" stroke="#4C6C0F" stroke-width="2"/>
    </g>

    <!-- Calles -->
    <g>
        <rect x="30" y="180" width="700" height="45" fill="#FFFFFF" stroke="#DEE4D8" stroke-width="1"/>
        <rect x="90" y="40" width="30" height="460" fill="#FFFFFF" stroke="#DEE4D8" stroke-width="1"/>
        <rect x="520" y="40" width="25" height="460" fill="#FFFFFF" stroke="#DEE4D8" stroke-width="1"/>
        <rect x="120" y="380" width="610" height="35" fill="#FFFFFF" stroke="#DEE4D8" stroke-width="1"/>
        <line x1="30" y1="202" x2="730" y2="202" stroke="#DEE4D8" stroke-width="2" stroke-dasharray="12 10"/>
        <line x1="105" y1="40" x2="105" y2="500" stroke="#DEE4D8" stroke-width="2" stroke-dasharray="12 10"/>
    </g>

    <!-- Nombres de las calles -->
    <g fill="#5B646E" letter-spacing="2" font-size="13">
        <text x="150" y="209" font-weight="700" fill="#171B20">AV. LOS ALISOS</text>
        <text x="620" y="209">doble sentido</text>
        <text x="14" y="470" transform="rotate(-90 14 470)">AV. LARCO</text>
        <text x="530" y="470" transform="rotate(-90 530 470)">JR. UNIÓN</text>
        <text x="150" y="402">CALLE BOLÍVAR</text>
    </g>

    <!-- Edificio del departamento -->
    <g>
        <rect x="120" y="225" width="400" height="155" fill="#E9F0DC" stroke="#B7D93C" stroke-width="3"/>
        <text x="140" y="255" font-size="13" font-weight="700" fill="#4C6C0F" letter-spacing="1.5">EDIFICIO ALAMEDA 240</text>
        <text x="140" y="276" font-size="12" fill="#5B646E" letter-spacing="1">8 pisos · año 2021 · una unidad por piso</text>
    </g>

    <!-- Marcador del inmueble. El pin y su rótulo viven dentro de la manzana y
         por debajo de las dos líneas del edificio: antes el pin las tapaba y el
         recuadro se comía el nombre de la avenida. -->
    <g transform="translate(140 318)">
        <path d="M0 0c-11 0-20 9-20 20 0 14 20 34 20 34s20-20 20-34c0-11-9-20-20-20Z" fill="#12161B" stroke="#D4F04F" stroke-width="3"/>
        <circle cx="0" cy="19" r="7" fill="#D4F04F"/>
    </g>
    <g>
        <rect x="176" y="300" width="300" height="40" rx="8" fill="#12161B"/>
        <text x="192" y="318" font-size="13" font-weight="700" fill="#D4F04F" letter-spacing="1">AL-2401 · AV. LOS ALISOS 240</text>
        <text x="192" y="333" font-size="12" fill="#EDEFF1" letter-spacing="1">piso 6 · 120 m² · S/ 690 000</text>
    </g>

    <!-- Referencias -->
    <g>
        <circle cx="105" cy="452" r="9" fill="#12161B"/>
        <text x="122" y="456" font-size="12" fill="#171B20" letter-spacing="1">Estación Metropolitano</text>

        <rect x="640" y="120" width="66" height="38" rx="6" fill="#FFFFFF" stroke="#DEE4D8" stroke-width="2"/>
        <text x="650" y="137" font-size="11" fill="#5B646E">colegio</text>
        <text x="650" y="151" font-size="11" fill="#5B646E">2 cuadras</text>

        <rect x="640" y="300" width="66" height="38" rx="6" fill="#FFFFFF" stroke="#DEE4D8" stroke-width="2"/>
        <text x="650" y="317" font-size="11" fill="#5B646E">mercado</text>
        <text x="650" y="331" font-size="11" fill="#5B646E">3 cuadras</text>
    </g>

    <!-- Rosa de los vientos y escala -->
    <g transform="translate(690 74)">
        <circle cx="0" cy="0" r="26" fill="none" stroke="#DEE4D8" stroke-width="2"/>
        <path d="M0 -18 7 7 0 2 -7 7z" fill="#4C6C0F"/>
        <text x="0" y="22" font-size="12" fill="#5B646E" text-anchor="middle">N</text>
    </g>

    <g transform="translate(30 528)">
        <line x1="0" y1="0" x2="120" y2="0" stroke="#4C6C0F" stroke-width="3" marker-start="url(#punta-mapa)" marker-end="url(#punta-mapa)"/>
        <text x="134" y="5" font-size="12" fill="#5B646E" letter-spacing="1">100 m</text>
    </g>
</svg>
