<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="titulo-oficina desc-oficina" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace">
    <title id="titulo-oficina">Plano de ubicación de la oficina</title>
    <desc id="desc-oficina">Plano de Miraflores con la avenida José Larco, la avenida Diagonal y el parque Kennedy: la oficina 802 está en el edificio 345 de la avenida Larco, a una cuadra del parque.</desc>

    <defs>
        <pattern id="verde-oficina" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
            <rect width="12" height="12" fill="#E4EBD9"/>
            <line x1="0" y1="0" x2="0" y2="12" stroke="#CBD8BA" stroke-width="4"/>
        </pattern>
    </defs>

    <rect x="0" y="0" width="760" height="540" fill="#F7F8F5"/>

    <text x="30" y="26" font-size="15" font-weight="700" fill="#171B20" letter-spacing="2">MIRAFLORES · CENTRO</text>

    <!-- Manzanas -->
    <g fill="#EDF0EA" stroke="#DEE4D8" stroke-width="2">
        <rect x="30" y="46" width="250" height="150"/>
        <rect x="330" y="46" width="400" height="150"/>
        <rect x="30" y="240" width="250" height="140"/>
        <rect x="330" y="240" width="400" height="140"/>
        <rect x="30" y="425" width="250" height="85"/>
        <rect x="330" y="425" width="400" height="85"/>
    </g>

    <!-- Parque Kennedy -->
    <g>
        <rect x="330" y="46" width="180" height="150" fill="url(#verde-oficina)" stroke="#CBD8BA" stroke-width="2"/>
        <text x="346" y="106" font-size="14" font-weight="700" fill="#4C6C0F" letter-spacing="2">PARQUE</text>
        <text x="346" y="128" font-size="14" font-weight="700" fill="#4C6C0F" letter-spacing="2">KENNEDY</text>
        <text x="346" y="152" font-size="12" fill="#5B646E" letter-spacing="1">a 1 cuadra</text>
    </g>

    <!-- Calles -->
    <g>
        <rect x="290" y="46" width="30" height="464" fill="#FFFFFF" stroke="#DEE4D8" stroke-width="1"/>
        <rect x="520" y="46" width="26" height="464" fill="#FFFFFF" stroke="#DEE4D8" stroke-width="1"/>
        <rect x="30" y="206" width="700" height="26" fill="#FFFFFF" stroke="#DEE4D8" stroke-width="1"/>
    </g>

    <!-- Nombres de las calles -->
    <g font-size="13" letter-spacing="2" fill="#5B646E">
        <text x="14" y="470" transform="rotate(-90 14 470)">AV. JOSÉ LARCO</text>
        <text x="530" y="470" transform="rotate(-90 530 470)">AV. DIAGONAL</text>
        <text x="330" y="224" fill="#171B20" font-weight="700">AV. JOSÉ LARCO</text>
        <text x="620" y="224">verde</text>
    </g>

    <!-- Edificio de la oficina -->
    <g>
        <rect x="30" y="240" width="250" height="140" fill="#E9F0DC" stroke="#B7D93C" stroke-width="3"/>
        <text x="46" y="272" font-size="13" font-weight="700" fill="#4C6C0F" letter-spacing="1.5">EDIFICIO LARCO 345</text>
        <text x="46" y="292" font-size="12" fill="#5B646E" letter-spacing="1">oficina 802 · piso 8</text>
    </g>

    <!-- Marcador de la oficina. El pin baja hasta la parte libre de la manzana
         (antes tapaba el rótulo del edificio) y el recuadro se pasa a la manzana
         de enfrente, unido al pin por una línea de llamada. -->
    <g transform="translate(150 318)">
        <path d="M0 0c-11 0-20 9-20 20 0 14 20 34 20 34s20-20 20-34c0-11-9-20-20-20Z" fill="#12161B" stroke="#D4F04F" stroke-width="3"/>
        <circle cx="0" cy="19" r="7" fill="#D4F04F"/>
    </g>
    <g>
        <line x1="170" y1="300" x2="336" y2="280" stroke="#12161B" stroke-width="2" stroke-dasharray="5 4"/>
        <rect x="340" y="258" width="300" height="40" rx="8" fill="#12161B"/>
        <text x="356" y="276" font-size="13" font-weight="700" fill="#D4F04F" letter-spacing="1">ALAMEDA PROPIEDADES</text>
        <text x="356" y="291" font-size="12" fill="#EDEFF1" letter-spacing="1">of. 802 · Lun a Vie 9 a 19 h</text>
    </g>

    <!-- Referencias -->
    <g font-size="12" fill="#171B20">
        <circle cx="345" cy="392" r="8" fill="#12161B"/>
        <text x="333" y="396" letter-spacing="1" text-anchor="end">Estación Metropolitano</text>

        <rect x="620" y="330" width="86" height="38" rx="6" fill="#FFFFFF" stroke="#DEE4D8" stroke-width="2"/>
        <text x="630" y="347" fill="#5B646E">banco</text>
        <text x="630" y="361" fill="#5B646E">al lado</text>

        <rect x="620" y="120" width="86" height="38" rx="6" fill="#FFFFFF" stroke="#DEE4D8" stroke-width="2"/>
        <text x="630" y="137" fill="#5B646E">cafés</text>
        <text x="630" y="151" fill="#5B646E">en el parque</text>
    </g>

    <!-- Rosa de los vientos y escala -->
    <g transform="translate(690 458)">
        <circle cx="0" cy="0" r="26" fill="none" stroke="#DEE4D8" stroke-width="2"/>
        <path d="M0 -18 7 7 0 2 -7 7z" fill="#4C6C0F"/>
        <text x="0" y="22" font-size="12" fill="#5B646E" text-anchor="middle">N</text>
    </g>

    <g transform="translate(30 528)">
        <line x1="0" y1="0" x2="120" y2="0" stroke="#4C6C0F" stroke-width="3"/>
        <text x="134" y="5" font-size="12" fill="#5B646E" letter-spacing="1">100 m</text>
    </g>
</svg>
