    <title id="titulo-plano">Plano del departamento AL-2401</title>
    <desc id="desc-plano">Plano de un departamento de 120 metros cuadrados: sala y comedor con balcón al frente, cocina con lavandería, estudio, hall de distribución, tres dormitorios (el principal con baño propio y vestidor), dos baños completos, escritorio, closet y depósito. Las medidas están anotadas en metros.</desc>
