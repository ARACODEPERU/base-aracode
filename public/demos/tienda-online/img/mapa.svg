<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Plano de la tienda Casa Lume en la avenida Santa Cruz con La Mar, en Miraflores: el parque Kennedy al sur, la iglesia Matriz al lado y la estación Ricardo Palma a diez minutos">
    <!--
        Plano propio de la tienda: un dibujo vectorial, no un mapa embebido.

        Traza la esquina donde está la tienda —avenida Santa Cruz con La Mar— con
        el parque Kennedy, la iglesia Matriz y la estación Ricardo Palma como
        referencias, para que quien venga a recoger su pedido se ubique de un
        vistazo y sin cargar ningún script de terceros.

        Se dibuja con la paleta clara y con el marcador en el naranja teja de la
        marca: en modo oscuro el CSS lo invierte con un filtro (`invert` + giro de
        tono) y el marcador vuelve a leerse. Los trazos y los textos van
        deliberadamente oscuros: al invertir, un gris claro se convierte en un
        gris casi negro sobre negro y el plano desaparece.
    -->
    <rect width="720" height="480" fill="#fdfcfa"/>

    <!-- Retícula de fondo, tenue: da textura de papel cuadriculado -->
    <pattern id="cuadricula" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M24 0H0v24" fill="none" stroke="#e6e0d9" stroke-width="1"/>
    </pattern>
    <rect width="720" height="480" fill="url(#cuadricula)"/>

    <!-- Manzanas -->
    <g fill="#f1ece6" stroke="#514c47" stroke-width="1.6">
        <rect x="16" y="16" width="252" height="150"/>
        <rect x="352" y="16" width="352" height="150"/>
        <rect x="16" y="268" width="252" height="196"/>
        <rect x="352" y="268" width="352" height="114"/>
    </g>

    <!-- Calles -->
    <g fill="#e8e2db" stroke="#514c47" stroke-width="1.6">
        <rect x="0" y="184" width="720" height="66"/>
        <rect x="280" y="0" width="60" height="480"/>
        <rect x="352" y="400" width="352" height="60"/>
    </g>

    <!-- Ejes de calle -->
    <g stroke="#6b655e" stroke-width="3" stroke-dasharray="18 14" stroke-linecap="round">
        <path d="M0 217h720"/>
        <path d="M310 0v480"/>
        <path d="M352 430h352"/>
    </g>

    <!-- Nombres de las calles -->
    <g fill="#2f2b27" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">
        <text x="40" y="210">AV. SANTA CRUZ</text>
        <text x="560" y="210">→ A LA COSTA VERDE</text>
        <text x="322" y="52" transform="rotate(90 322 52)">AV. LA MAR</text>
        <text x="368" y="452">DIAGONAL</text>
    </g>

    <!-- Predios de referencia -->
    <g fill="#4a453f" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6">
        <text x="34" y="58">GALERÍA</text>
        <text x="34" y="76">DE DISEÑO</text>
        <text x="370" y="58">IGLESIA</text>
        <text x="370" y="76">MATRIZ</text>
        <text x="34" y="300">PARQUE</text>
        <text x="34" y="318">KENNEDY</text>
    </g>

    <!-- Árboles del parque -->
    <g fill="#d3ccc2">
        <circle cx="80" cy="150" r="12"/>
        <circle cx="126" cy="170" r="9"/>
        <circle cx="176" cy="146" r="11"/>
        <circle cx="228" cy="168" r="9"/>
    </g>

    <!-- Estación de la línea 1 -->
    <g transform="translate(96 217)">
        <circle r="16" fill="#fdfcfa" stroke="#2f2b27" stroke-width="3"/>
        <text x="-11" y="5" fill="#2f2b27" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">L1</text>
        <text x="-92" y="38" fill="#2f2b27" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">ESTACIÓN RICARDO PALMA · 10 MIN</text>
    </g>

    <!-- Parada de bus -->
    <g transform="translate(614 217)">
        <rect x="-13" y="-13" width="26" height="26" fill="#fdfcfa" stroke="#2f2b27" stroke-width="2"/>
        <text x="-6" y="6" fill="#2f2b27" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">B</text>
    </g>

    <!-- La tienda: el predio se marca con línea gruesa y el rótulo con punta -->
    <rect x="352" y="268" width="150" height="110" fill="none" stroke="#e0491f" stroke-width="3"/>

    <g transform="translate(427 323)">
        <circle r="26" fill="none" stroke="#e0491f" stroke-width="2" opacity="0.35"/>
        <circle r="12" fill="#e0491f"/>
        <rect x="-15" y="-46" width="30" height="30" fill="#e0491f"/>
        <text x="-8" y="-25" fill="#ffffff" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17">C</text>
    </g>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="1.4">
        <rect x="516" y="292" width="188" height="52" fill="#1c1917"/>
        <text x="530" y="314" fill="#ffffff" font-size="13">CASA LUME</text>
        <text x="530" y="334" fill="#f3a98d" font-size="12">AV. SANTA CRUZ 780</text>
    </g>

    <!-- Rosa de los vientos -->
    <g transform="translate(676 60)">
        <path d="M0 -26 8 6 0 -2 -8 6Z" fill="#2f2b27"/>
        <text x="-5" y="-32" fill="#2f2b27" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">N</text>
    </g>

    <!-- Cartela -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="1.4">
        <rect x="16" y="418" width="320" height="46" fill="#fdfcfa" stroke="#514c47" stroke-width="1.5"/>
        <text x="30" y="438" fill="#2f2b27" font-size="12">LIMA · DISTRITO DE MIRAFLORES</text>
        <text x="30" y="455" fill="#6b655e" font-size="11">PLANO DE REFERENCIA · 1 CUADRA ≈ 100 M</text>
    </g>
</svg>
