<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Plano de la ubicación del estudio contable en la Av. Pardo 890, oficina 302, Nuevo Chimbote">
    <title>Plano de la ubicación del estudio contable</title>

    <!--
        Plano propio de la demostración: dibujado a mano en SVG para no cargar
        scripts de mapas de terceros (privacidad y peso). El botón «Abrir en
        Google Maps» del HTML sí lleva a la dirección del negocio, así que el
        visitante llega con indicaciones giro a giro.
    -->

    <defs>
        <linearGradient id="agua" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C6DCEF"/>
            <stop offset="1" stop-color="#ACCBE4"/>
        </linearGradient>
    </defs>

    <rect width="900" height="560" fill="#F4F8FC"/>

    <!-- Manzanas -->
    <g fill="#E7EFF7">
        <rect x="40" y="40" width="200" height="150" rx="10"/>
        <rect x="270" y="40" width="230" height="150" rx="10"/>
        <rect x="530" y="40" width="150" height="150" rx="10"/>
        <rect x="40" y="230" width="200" height="120" rx="10"/>
        <rect x="270" y="230" width="230" height="120" rx="10"/>
        <rect x="530" y="230" width="150" height="120" rx="10"/>
        <rect x="40" y="390" width="200" height="130" rx="10"/>
        <rect x="270" y="390" width="230" height="130" rx="10"/>
        <rect x="530" y="390" width="150" height="130" rx="10"/>
    </g>

    <!-- Bahía y avenidas -->
    <rect x="700" y="0" width="200" height="560" fill="url(#agua)"/>
    <rect x="0" y="200" width="900" height="20" fill="#FFFFFF"/>
    <rect x="0" y="370" width="900" height="14" fill="#FFFFFF"/>
    <rect x="250" y="0" width="16" height="560" fill="#FFFFFF"/>
    <rect x="510" y="0" width="16" height="560" fill="#FFFFFF"/>

    <!-- Nombres de calles -->
    <g fill="#586A80" font-family="Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600">
        <text x="30" y="215">Av. Pardo</text>
        <text x="30" y="384">Jr. Elías Aguirre</text>
        <text x="258" y="26" transform="rotate(90 258 26)">Av. Argentina</text>
        <text x="518" y="26" transform="rotate(90 518 26)">Av. Aviación</text>
    </g>

    <!-- Referencias del barrio -->
    <g fill="#8697AB" font-family="Segoe UI, Roboto, sans-serif" font-size="14">
        <text x="70" y="120">Plaza de armas</text>
        <text x="300" y="120">Banco</text>
        <text x="556" y="120">Notaría</text>
        <text x="70" y="300">Estacionamiento</text>
        <text x="300" y="300">Municipalidad</text>
        <text x="70" y="470">Notaría y registros</text>
        <text x="300" y="470">Sunarp</text>
    </g>
    <text x="760" y="290" fill="#586A80" font-family="Segoe UI, Roboto, sans-serif" font-size="14" transform="rotate(90 760 290)">Bahía de Chimbote</text>

    <!-- El estudio: marcador sobre la Av. Pardo -->
    <g transform="translate(150 232)">
        <path d="M0 60c0-14 26-34 26-56A26 26 0 1 0-26 4c0 22 26 42 26 56Z" fill="#143A66" transform="translate(0 -4)"/>
        <circle cx="0" cy="-22" r="9" fill="#FFFFFF"/>
        <!-- Una calculadora, el símbolo del estudio -->
        <g fill="none" stroke="#143A66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="-5.6" y="-28.2" width="11.2" height="13" rx="2" fill="#FFFFFF"/>
            <rect x="-3.4" y="-25.8" width="6.8" height="2.6" rx="0.8" fill="#D9A63C" stroke="none"/>
            <path d="M-3.4-20.6h1.4M-0.7-20.6h1.4M2-20.6h1.4M-3.4-17.8h1.4M-0.7-17.8h1.4M2-17.8h1.4"/>
        </g>
    </g>

    <g font-family="Segoe UI, Roboto, sans-serif">
        <rect x="196" y="252" width="278" height="54" rx="12" fill="#FFFFFF" stroke="#E0E8F0"/>
        <text x="214" y="275" fill="#14243B" font-size="16" font-weight="700">Estudio Contable Vega</text>
        <text x="214" y="295" fill="#586A80" font-size="14">Av. Pardo 890, oficina 302 · a 2 cuadras del banco</text>
    </g>

    <!-- Brújula -->
    <g transform="translate(838 502)" font-family="Segoe UI, Roboto, sans-serif">
        <circle r="26" fill="#FFFFFF" stroke="#E0E8F0"/>
        <path d="M0-14 6 6 0 2 -6 6Z" fill="#143A66"/>
        <text x="-4" y="-16" fill="#586A80" font-size="11" font-weight="700">N</text>
    </g>
</svg>
