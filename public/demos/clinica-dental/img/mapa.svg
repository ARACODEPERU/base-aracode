<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Plano de la ubicación de la clínica en la Av. Pacífico 455, Nuevo Chimbote">
    <title>Plano de la ubicación de la clínica</title>

    <!--
        Plano propio de la demostración: dibujado a mano en SVG para no cargar
        scripts de mapas de terceros (privacidad y peso). El botón «Abrir en
        Google Maps» del HTML lleva a la dirección real del negocio, así que el
        visitante sí llega con indicaciones giro a giro.
    -->

    <defs>
        <linearGradient id="agua" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#BFE6E0"/>
            <stop offset="1" stop-color="#9FD8D0"/>
        </linearGradient>
    </defs>

    <rect width="900" height="560" fill="#F1F8F6"/>

    <!-- Manzanas -->
    <g fill="#E4EFEC">
        <rect x="40" y="40" width="200" height="150" rx="10"/>
        <rect x="270" y="40" width="230" height="150" rx="10"/>
        <rect x="530" y="40" width="150" height="150" rx="10"/>
        <rect x="40" y="230" width="200" height="120" rx="10"/>
        <rect x="270" y="230" width="230" height="120" rx="10"/>
        <rect x="530" y="230" width="150" height="120" rx="10"/>
        <rect x="40" y="390" width="200" height="130" rx="10"/>
        <rect x="270" y="390" width="230" height="130" rx="10"/>
        <rect x="530" y="390" width="150" height="130" rx="10"/>
    </g>

    <!-- Mar y avenidas -->
    <rect x="700" y="0" width="200" height="560" fill="url(#agua)"/>
    <rect x="0" y="200" width="900" height="20" fill="#FFFFFF"/>
    <rect x="0" y="370" width="900" height="14" fill="#FFFFFF"/>
    <rect x="250" y="0" width="16" height="560" fill="#FFFFFF"/>
    <rect x="510" y="0" width="16" height="560" fill="#FFFFFF"/>

    <!-- Nombres de calles -->
    <g fill="#5C6E6A" font-family="Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600">
        <text x="30" y="215">Av. Pacífico</text>
        <text x="30" y="384">Jr. Los Álamos</text>
        <text x="258" y="26" transform="rotate(90 258 26)">Av. Argentina</text>
        <text x="518" y="26" transform="rotate(90 518 26)">Av. Pardo</text>
    </g>

    <!-- Referencias del barrio -->
    <g fill="#8FA3A0" font-family="Segoe UI, Roboto, sans-serif" font-size="14">
        <text x="70" y="120">Plaza de armas</text>
        <text x="300" y="120">Mercado central</text>
        <text x="556" y="120">Colegio</text>
        <text x="70" y="300">Estacionamiento</text>
        <text x="300" y="300">Municipalidad</text>
        <text x="70" y="470">Farmacia</text>
        <text x="300" y="470">Banco</text>
    </g>
    <text x="760" y="290" fill="#5C6E6A" font-family="Segoe UI, Roboto, sans-serif" font-size="14" transform="rotate(90 760 290)">Bahía de Chimbote</text>

    <!-- La clínica: marcador sobre la Av. Pacífico -->
    <g transform="translate(150 232)">
        <path d="M0 60c0-14 26-34 26-56A26 26 0 1 0-26 4c0 22 26 42 26 56Z" fill="#0E9F8A" transform="translate(0 -4)"/>
        <circle cx="0" cy="-22" r="9" fill="#FFFFFF"/>
        <path d="M-3.4-27h6.8M0-30.4v6.8" stroke="#0E9F8A" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <g font-family="Segoe UI, Roboto, sans-serif">
        <rect x="196" y="252" width="252" height="54" rx="12" fill="#FFFFFF" stroke="#E1EBE8"/>
        <text x="214" y="275" fill="#10231F" font-size="16" font-weight="700">Clínica Dental Sonrisa</text>
        <text x="214" y="295" fill="#5C6E6A" font-size="14">Av. Pacífico 455 · a 2 cuadras de la plaza</text>
    </g>

    <!-- Brújula -->
    <g transform="translate(838 502)" font-family="Segoe UI, Roboto, sans-serif">
        <circle r="26" fill="#FFFFFF" stroke="#E1EBE8"/>
        <path d="M0-14 6 6 0 2 -6 6Z" fill="#0E9F8A"/>
        <text x="-4" y="-16" fill="#5C6E6A" font-size="11" font-weight="700">N</text>
    </g>
</svg>
