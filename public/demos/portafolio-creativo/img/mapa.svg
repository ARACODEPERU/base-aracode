<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Plano de la esquina del estudio en la avenida Grau con el jirón Unión, con el mercado al sur, el parque al norte y la estación de la línea 1 al oeste">
    <!--
        Plano propio del estudio: un dibujo vectorial, no un mapa embebido.

        Traza la esquina real a escala de manzana —avenida Grau con jirón Unión,
        el mercado al sur, el parque al norte y la estación de la línea 1 a tres
        cuadras— para que quien va a venir se ubique de un vistazo, sin cargar
        ningún script de terceros.

        Se dibuja con la paleta clara y con el marcador en el acento: en modo
        oscuro el CSS lo invierte con un filtro (`invert` + giro de tono) y el
        marcador vuelve a leerse. El predio del estudio no lleva relleno de
        color: se reconoce por el marcador y su rótulo.

        Los trazos y los textos van deliberadamente oscuros: al invertir, un
        gris claro se convierte en un gris casi negro sobre negro y el plano
        desaparece. Con tinta oscura el dibujo invertido queda claro sobre
        oscuro y se sigue leyendo.
    -->
    <rect width="720" height="480" fill="#f7f6f2"/>

    <!-- Retícula de fondo, tenue: da textura de papel cuadriculado -->
    <pattern id="cuadricula" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M24 0H0v24" fill="none" stroke="#dcd9d0" stroke-width="1"/>
    </pattern>
    <rect width="720" height="480" fill="url(#cuadricula)"/>

    <!-- Manzanas -->
    <g fill="#e3e0d6" stroke="#55534b" stroke-width="1.6">
        <rect x="16" y="16" width="268" height="166"/>
        <rect x="366" y="16" width="338" height="166"/>
        <rect x="16" y="262" width="268" height="202"/>
        <rect x="366" y="262" width="338" height="202"/>
    </g>

    <!-- Calles -->
    <g fill="#ddd9cf" stroke="#55534b" stroke-width="1.6">
        <rect x="0" y="188" width="720" height="68"/>
        <rect x="290" y="0" width="70" height="480"/>
    </g>

    <!-- Ejes de calle -->
    <g stroke="#6a6860" stroke-width="3" stroke-dasharray="18 14" stroke-linecap="round">
        <path d="M0 222h720"/>
        <path d="M325 0v480"/>
    </g>

    <!-- Nombres de las calles -->
    <g fill="#3a3934" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">
        <text x="40" y="214">AV. GRAU</text>
        <text x="568" y="214">→ AL MALECÓN</text>
        <text x="337" y="52" transform="rotate(90 337 52)">JR. UNIÓN</text>
    </g>

    <!-- Predios de referencia -->
    <g fill="#4e4c45" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6">
        <text x="34" y="60">PARQUE</text>
        <text x="34" y="78">MUNICIPAL</text>
        <text x="384" y="60">GALERÍA</text>
        <text x="384" y="78">BARRIO</text>
        <text x="34" y="300">MERCADO DE</text>
        <text x="34" y="318">BARRANCO</text>
    </g>

    <!-- Árboles del parque -->
    <g fill="#b8b5a9">
        <circle cx="80" cy="130" r="12"/>
        <circle cx="120" cy="150" r="9"/>
        <circle cx="170" cy="120" r="11"/>
        <circle cx="226" cy="146" r="9"/>
    </g>

    <!-- Estación de la línea 1 -->
    <g transform="translate(112 226)">
        <circle r="16" fill="#f7f6f2" stroke="#3a3934" stroke-width="3"/>
        <text x="-11" y="5" fill="#3a3934" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">L1</text>
        <text x="-92" y="36" fill="#3a3934" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">ESTACIÓN BARRANCO · 8 MIN</text>
    </g>

    <!-- Parada de bus -->
    <g transform="translate(600 226)">
        <rect x="-13" y="-13" width="26" height="26" fill="#f7f6f2" stroke="#3a3934" stroke-width="2"/>
        <text x="-6" y="6" fill="#3a3934" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">B</text>
    </g>

    <!-- El estudio: el predio se marca con línea gruesa y el rótulo con punta -->
    <rect x="366" y="262" width="150" height="120" fill="none" stroke="#d6006e" stroke-width="3"/>

    <g transform="translate(441 322)">
        <circle r="26" fill="none" stroke="#d6006e" stroke-width="2" opacity="0.35"/>
        <circle r="12" fill="#d6006e"/>
        <rect x="-15" y="-46" width="30" height="30" fill="#d6006e"/>
        <text x="-8" y="-25" fill="#ffffff" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17">M</text>
    </g>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="1.4">
        <rect x="524" y="286" width="176" height="52" fill="#17171a"/>
        <text x="538" y="308" fill="#ffffff" font-size="13">MESA NORTE</text>
        <text x="538" y="328" fill="#ff5cae" font-size="12">AV. GRAU 320</text>
    </g>

    <!-- Rosa de los vientos -->
    <g transform="translate(676 60)">
        <path d="M0 -26 8 6 0 -2 -8 6Z" fill="#3a3934"/>
        <text x="-5" y="-32" fill="#3a3934" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">N</text>
    </g>

    <!-- Cartela -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="1.4">
        <rect x="366" y="418" width="338" height="46" fill="#f7f6f2" stroke="#55534b" stroke-width="1.5"/>
        <text x="382" y="438" fill="#3a3934" font-size="12">LIMA · DISTRITO DE BARRANCO</text>
        <text x="382" y="455" fill="#6a6860" font-size="11">PLANO DE REFERENCIA · 1 CUADRA ≈ 100 M</text>
    </g>
</svg>
